<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Front Doors</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light dark}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: persona sheet on the left, a framed clickable prototype on the right; one column on a phone. Tokens follow Mission Control's own (hue 260 neutrals, blue accent). */
:root{
  --bg:oklch(0.975 0.004 260); --panel:oklch(1 0 0); --sunk:oklch(0.955 0.005 260);
  --line:oklch(0.89 0.008 260); --fg:oklch(0.23 0.012 260); --dim:oklch(0.45 0.012 260); --faint:oklch(0.60 0.010 260);
  --accent:oklch(0.52 0.16 240); --accent-soft:oklch(0.94 0.03 240); --on-accent:oklch(1 0 0);
  --local:oklch(0.48 0.10 185); --local-soft:oklch(0.95 0.03 185);
  --wait:oklch(0.50 0.14 60); --wait-soft:oklch(0.95 0.045 80);
  --ok:oklch(0.48 0.13 155); --ok-soft:oklch(0.95 0.04 155);
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:oklch(0.17 0.008 260); --panel:oklch(0.215 0.008 260); --sunk:oklch(0.19 0.008 260);
  --line:oklch(0.31 0.010 260); --fg:oklch(0.94 0.005 260); --dim:oklch(0.72 0.010 260); --faint:oklch(0.56 0.010 260);
  --accent:oklch(0.74 0.13 240); --accent-soft:oklch(0.29 0.05 240); --on-accent:oklch(0.17 0.02 240);
  --local:oklch(0.78 0.10 185); --local-soft:oklch(0.27 0.04 185);
  --wait:oklch(0.82 0.13 80); --wait-soft:oklch(0.29 0.05 80);
  --ok:oklch(0.78 0.13 155); --ok-soft:oklch(0.27 0.04 155); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:oklch(0.17 0.008 260); --panel:oklch(0.215 0.008 260); --sunk:oklch(0.19 0.008 260);
  --line:oklch(0.31 0.010 260); --fg:oklch(0.94 0.005 260); --dim:oklch(0.72 0.010 260); --faint:oklch(0.56 0.010 260);
  --accent:oklch(0.74 0.13 240); --accent-soft:oklch(0.29 0.05 240); --on-accent:oklch(0.17 0.02 240);
  --local:oklch(0.78 0.10 185); --local-soft:oklch(0.27 0.04 185);
  --wait:oklch(0.82 0.13 80); --wait-soft:oklch(0.29 0.05 80);
  --ok:oklch(0.78 0.13 155); --ok-soft:oklch(0.27 0.04 155); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:19px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;margin:0}
p{margin:0}
.lede{color:var(--dim);max-width:66ch;font-size:16px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{background:none;border:1px solid transparent;border-radius:8px;padding:7px 13px;color:var(--dim);font-weight:500}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--fg)}
.tab small{display:block;font-weight:400;font-size:12px;color:var(--faint)}
.split{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.sheet{display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--dim)}
.sheet li b{color:var(--fg);font-weight:600}
.who{display:flex;gap:12px;align-items:center}
.ava{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.who span{display:block;color:var(--dim);font-size:13.5px}
.quote{font-size:15.5px;color:var(--fg);border-left:2px solid var(--line);padding-left:12px}
.frame{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--sunk);font-size:12.5px;color:var(--faint)}
.bar b{color:var(--dim);font-weight:600}
.body{padding:22px;display:flex;flex-direction:column;gap:16px}
@media (max-width:520px){.body{padding:16px}}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{border-color:transparent;color:var(--dim);padding-inline:6px}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.wait{background:var(--wait-soft);color:var(--wait)} .pill.think{background:var(--accent-soft);color:var(--accent)}
.pill.calm{background:var(--sunk);color:var(--dim)} .pill.local{background:var(--local-soft);color:var(--local)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
input[type=text],input[type=date],textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;min-width:0}
textarea{min-height:74px;resize:vertical}
label{font-size:13px;font-weight:600;color:var(--dim);display:flex;flex-direction:column;gap:5px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:7px;background:var(--panel);text-align:left;width:100%}
button.card:hover{border-color:var(--faint)}
.card .q{font-weight:600;font-size:15.5px}
.card .sub{color:var(--dim);font-size:14px}
.ivy{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.ivy .from{font-size:12.5px;font-weight:600;color:var(--accent)}
.sunk{background:var(--sunk);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--dim);font-size:14px} .faint{color:var(--faint);font-size:13px}
.toast{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:500}
.big{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.3;text-wrap:balance}
details summary{cursor:pointer;color:var(--dim);font-weight:500;font-size:14px}
details ul{margin:8px 0 0;padding-left:18px;color:var(--dim);font-size:14px}
/* Luca */
.two{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:0}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.queue{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
@media (max-width:700px){.queue{border-right:0;border-bottom:1px solid var(--line)}}
.qi{background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;text-align:left;display:flex;flex-direction:column;gap:3px}
.qi[aria-current="true"]{background:var(--accent-soft)}
.qi .k{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.qi .t{font-weight:500;font-size:14px}
.qi.done .t{text-decoration:line-through;color:var(--faint)}
.src{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--dim)}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--panel);font-weight:400;color:var(--fg);flex-direction:row;font-size:14.5px}
.opt:has(input:checked){border-color:var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--faint)}
.steps span[data-on="true"]{color:var(--accent)}
pre.note{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--dim)}
/* Sam */
.meter{display:flex;gap:4px;align-items:center}
.meter i{width:16px;height:8px;border-radius:2px;background:var(--line)} .meter i.on{background:var(--accent)}
.tr{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.tr[aria-current="true"]{background:var(--accent-soft)}
.tr .n{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.tr .q{font-weight:500}
.tr .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.exp{padding:12px 14px 16px 46px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
@media (max-width:600px){.exp{padding-left:14px}.tr{grid-template-columns:22px minmax(0,1fr)}.tr .meta{grid-column:2;justify-content:flex-start}}
.diff{font-size:14px;display:flex;flex-direction:column;gap:3px}
.diff del{color:var(--faint)} .diff ins{text-decoration:none;color:var(--fg);font-weight:500}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel);color:var(--dim)}
.keys{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}
/* Overview */
.three{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.three{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:8px}
.card.dashed{border-style:dashed}
.ar{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ar label{flex-direction:row;align-items:center;gap:10px;font-weight:500}
.ar input[type=range]{accent-color:var(--accent);flex:1;max-width:220px;min-width:0}
.balbar{position:relative;height:8px;border-radius:4px;background:var(--sunk);max-width:420px}
.balbar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.balbar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.pj{display:flex;flex-direction:column;padding-left:14px;border-left:2px solid var(--line)}
.pj>b{font-size:13px;color:var(--dim);padding-top:6px}
.vrow.dr{grid-template-columns:auto minmax(0,1.2fr) minmax(0,1fr) auto;cursor:grab}
.hd{background:none;border:0;color:var(--faint);font-size:12px;letter-spacing:-2px;padding:4px 6px 4px 2px;cursor:grab;border-radius:5px}
.hd:hover,.hd[aria-expanded="true"]{color:var(--fg);background:var(--sunk)}
.vrow[data-zone="before"]{box-shadow:0 -2px 0 var(--accent)}
.vrow[data-zone="after"]{box-shadow:0 2px 0 var(--accent)}
.vrow[data-zone="into"],.anch[data-zone="into"]{background:var(--accent-soft);color:var(--accent);border-radius:6px}
.gchip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13.5px;color:var(--dim);font-weight:500}
.gchip:hover{border-color:var(--accent);color:var(--fg)}
@media (max-width:640px){.vrow.dr{grid-template-columns:auto minmax(0,1fr) auto}}
.anc{border:1px solid var(--line);border-radius:14px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.anc .anc{background:var(--bg)}
.anch{background:none;border:0;text-align:left;font-size:13px;font-weight:600;color:var(--dim);padding:3px 6px;align-self:flex-start;border-radius:6px}
.anch:hover{color:var(--fg);text-decoration:underline}
.cur{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--panel);display:flex;flex-direction:column;gap:12px}
.anc>.cur{border-color:var(--accent)}
@media (max-width:520px){.cur{padding:12px}.anc{padding:4px 5px 5px}}
.daygrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:22px;align-items:start}
@media (max-width:900px){.daygrid{grid-template-columns:minmax(0,1fr)}.daygrid .rail{order:-1}}
.rail{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:8px;font-size:13.5px;border:1px solid transparent}
.slot.ev{background:var(--sunk)}
.slot.free{border:1px dashed var(--line)}
.slot.cur{border-color:var(--accent)}
.slot.past{opacity:.5}
.tm{font-family:var(--mono);font-size:12px;color:var(--faint)}
.chip{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;background:var(--accent-soft);border-radius:7px;padding:5px 8px;margin-top:6px}
.chip .linkq{font-size:13px;font-weight:500}
.chip.off{opacity:.45}
.evb{background:none;border:0;padding:0;text-align:left}
.evb:hover b{text-decoration:underline}
.evd{grid-column:1/-1;display:flex;flex-direction:column;gap:7px;padding-top:6px;align-items:flex-start;min-width:0}
.evd .lk{background:var(--wait-soft);color:var(--wait);border:0;border-radius:6px;padding:4px 7px;text-align:left;font-size:12.5px;font-weight:600}
.evd input{padding:6px 9px;font-size:13.5px}
.chip .x{background:none;border:0;color:var(--dim);padding:0 3px;font-size:12.5px}
.chip .x:hover{color:var(--fg)}
.week{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:8px}
.wd{border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;font-size:13px;min-height:128px;min-width:0}
.wd.today{border-color:var(--accent)}
.wd .lk{background:var(--wait-soft);color:var(--wait);border:0;border-radius:6px;padding:4px 7px;text-align:left;font-size:12.5px;font-weight:600}
.vrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.vrow.wide{grid-template-columns:minmax(0,1fr) auto auto}
.vrow .linkq{font-size:14.5px}
@media (max-width:640px){.vrow,.vrow.wide{grid-template-columns:minmax(0,1fr) auto}.vrow>.faint{grid-column:1/-1;grid-row:2}}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;border-radius:7px;padding:4px 11px;font-size:13.5px;font-weight:500;color:var(--dim)}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
ul.plain{margin:4px 0 0;padding-left:18px;color:var(--dim)}
.sum{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--panel)}
.sum ul{margin:4px 0 0;padding-left:18px;color:var(--dim);font-size:14px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:520px){.cols{grid-template-columns:minmax(0,1fr)}}
.turns{display:flex;flex-direction:column;gap:10px;margin-top:12px;max-width:62ch}
.turn{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:14px}
.turn b{font-size:12px;color:var(--accent);padding-top:2px}
.turn.me b{color:var(--faint)}
.turn p{color:var(--dim)}
.linkq{background:none;border:0;padding:0;text-align:left;font-weight:600;font-size:15.5px}
.linkq:hover{text-decoration:underline}
button.src{cursor:pointer}
button.src[aria-expanded="true"]{border-color:var(--accent);color:var(--fg)}
.src.flag{text-decoration:line-through}
.excerpt{border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:14px;color:var(--dim)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
td code,.code{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.find{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px}
.find .c{font-family:var(--mono);font-size:12.5px;color:var(--accent);padding-top:2px}
.find p{color:var(--dim)} .find b{color:var(--fg)}
section{display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:no-preference){.frame .body{animation:in .18s ease-out}@keyframes in{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <span class="eyebrow">Cortex Desk · design prototypes · sample data throughout</span>
    <h1>One Studio for everyone</h1>
    <p class="lede">The thread files and the acts stay as they are. The One Studio tab is the current direction: one screen with a low floor and a high ceiling. The persona tabs are the steps that led to it.</p>
  </header>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-go="overview">Overview<small>personas and findings</small></button>
    <button class="tab" role="tab" data-go="studio">One Studio<small>list, day and week</small></button>
    <button class="tab" role="tab" data-go="kim">Kim<small>What matters now</small></button>
    <button class="tab" role="tab" data-go="luca">Luca<small>Think in place</small></button>
    <button class="tab" role="tab" data-go="sam">Sam<small>Morning review</small></button>
    <button class="tab" role="tab" data-go="options">Two options<small>one Studio or a setting</small></button>
  </nav>
  <main id="view"></main>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const view = $("#view");
const ROUTES = ["overview", "studio", "kim", "luca", "sam", "options"];
const route = () => { const h = location.hash.slice(1); return ROUTES.includes(h) ? h : "overview"; };

/* ---------- persona sheets ---------- */
const PERSONAS = {
  nora: { ini: "N", name: "Nora", role: "Head of operations at a 40-person firm. A consulting client.",
    quote: "I tried the chat tools. The answers were generic. I just want it to work.",
    ctx: ["Never saw a config file. Someone set the stack up for her.", "Opens the Desk between meetings, for two minutes at a time.", "Thinks in questions and decisions, not in threads and files."],
    tasks: ["Put down a question that nags her, before the next meeting starts.", "Read what Ivy thought and react in ten seconds.", "Decide, and find the reason again three months later."],
    trips: ["Twenty new words before the first use: thread, place, cap, shelf, stand, proposal, capture.", "Opening a thread asks the Yes-filter questions and which thread to park.", "The thread page shows nine sections at once."],
    needs: ["One input, one list, one status per question.", "Yes or Not quite as the only reply to Ivy.", "No limits to learn. Her view is folded into One Studio."] },
  luca: { ini: "L", name: "Luca", role: "Security analyst on a shift team. A colleague.",
    quote: "Show me what it read before I act on it.",
    ctx: ["Technical, but new to agents. Trusts logs, not summaries.", "Works a queue: mail, a blocked agent, a meeting in twenty minutes.", "Hands over to the next shift every day."],
    tasks: ["Clear what needs him, in order.", "Think a hard item through without leaving it.", "Write the handover from what he decided."],
    trips: ["The Studio is a separate place. His question starts on a Desk item.", "Ivy's notes carry no visible sources.", "What he thought about yesterday does not show on the item today."],
    needs: ["Thinking opens beside the item it is about.", "Every source opens to what Ivy took from it, and he can flag one as wrong.", "He can ask for the case against his call before he decides.", "A decision turns into a handover line and a short summary on the item."] },
  kim: { ini: "V", name: "Kim", role: "GFK coach, self-employed. Works alone, with clients, groups and schools.",
    quote: "Things come up all day. I do not want to choose five. I want to see what matters today.",

  const from = [["From Kim", "The Now list without a cap, the list of what else is on your mind, and loose thoughts that find their question."], ["From Luca", "Thinking opens inside the item. Sources open and can be flagged. Challenge my call. Every call lands in today's log, which copies as a handover. Mail and waiting agents sit in the same list as questions."], ["From Nora", "Yes or Not quite as the answer to a suggestion from Ivy, and the optional reminder to check on a decision later."], ["From your screen", "More on a row, think tonight, parked, reviews due and the keyboard shortcuts, all quiet until asked for."], ["From Balance", "The outline is the Everything view. You drill in: open a row and it becomes the page, framed by what it sits in, and you add rows inside it. Any row can hold more rows. The engine's proposal is the Now list. Its reasons show on the rows, such as an area that is behind this week."], ["Greeting, done for you, weekly review", "The Now page is a stream. What is new since yesterday comes up at the top as cards and leaves once you have dealt with it: a waiting agent, a suggestion from Ivy, what was done for you, an open review. Done for you shows its groups with a reason and an undo each. The weekly review is four things to look at, each with one decision."], ["From Ranger, routines and flows", "One question decides it: who does a row. You, an agent once, or a routine on a schedule. A waiting agent, a routine that asks first and a routine that failed come up in the stream. Handed over lists agents at work, routines and their steps, and recipes. Typing something that repeats offers to make it a routine."], ["Calendar", "The day sits beside the list, with the free time between meetings. Plan it today puts an item into the next free time that fits. The week shows which question belongs to which day. A meeting opens to who, where and what you want to raise. When it ends, it asks once whether there is anything to keep. Ten minutes before, it comes up at the top with what you kept last time and Ivy's brief. Every fact in the brief names the adapter it came from, and the brief says what it could not read."]];

    <section><h2>What was folded in</h2><div class="find" style="grid-template-columns:minmax(0,1fr);max-width:72ch">${from.map(([k, v]) => `<p><b>${k}.</b> ${esc(v)}</p>`).join("")}</div>
      <p class="faint">Low floor, high ceiling: the first screen is a list, an input and the day. Dropped: Nora's limit of three, her separate question page, and Luca's two-pane layout.</p></section></div>`;

function studioAct(a, el) {

/* ---------- Overview ---------- */
const FINDINGS = [
  ["F1", "Too many words before the first use.", "The Studio surface names about twenty concepts: thread, place, cap, shelf, parked, capture, inbox, proposal, stand, Yes-filter, material, relates, decision journal, think tonight, local, cloud, personas. A newcomer meets all of them on one board."],
  ["F2", "The board spends the screen on structure.", "Numbered places, an inbox column, a proposal column and routed lines between them explain how the Studio is built. They do not answer what needs the person now."],
  ["F3", "The thread page shows everything at once.", "Question, Where I stand, Ivy's latest, Ivy's notes, Your answers, Material, Log, Relates to with six groups, Outcome, and about ten acts. Most visits need one: react to the latest note."],
  ["F4", "Starting a thread is the heaviest moment.", "Opening one asks the Yes-filter and, at the cap, which thread to park. The friction sits where capture should be cheapest. Kim's prototype tries the alternative: no cap, and a Now section."],
  ["F5", "The Studio is a place you go to.", "It is one of five modes next to Day, Balance, Conversations and Catch-up. A question usually starts on a Desk item, and that item has no way into thinking."],
  ["F6", "Withdrawn: the local or cloud badge is fine.", "Most people have no local model. The badge stays as it is and counts as an advanced feature. What remains of this finding is that Ivy's notes show no sources."],
  ["F7", "A kept conversation lands as one wall of text.", "On the thread page, a talked-through session is stored as a single note: the whole exchange in one paragraph, with raw Markdown asterisks, several screens long. It pushes everything else off the page."],
  ["F8", "The greeting is a paragraph, not a summary.", "The Day view opens with about a hundred words in one block, including task titles and a raw link. It says five things need you, while the Catch-up panel beside it counts more than two hundred that need an action."],
  ["F9", "Unrelated history hangs under the board.", "Below the Studio board, Done for you lists a dozen mail deletions, each with an Undo button. None of it concerns a thread."],
];
const WORDS = [["thread", "question", "all"], ["place, cap", "no cap; a Now list", "Kim"], ["parked, shelf", "Also on your mind; Park behind More", "Kim, you"], ["Where I stand, stand proposal", "Ivy suggests you stand here: Yes or Not quite", "Nora"], ["proposal, capture, inbox", "one input; Ivy offers to add a thought to a question", "Kim"], ["Yes-filter", "optional", "your ruling"], ["Desk items, separate from threads", "mail and waiting agents in the same Now list", "Luca"], ["Ivy's notes without sources", "sources that open and can be flagged", "Luca"], ["talked-through note", "summary: settled, still open, before and after", "Kim, Luca"], ["close with an outcome", "Your call, with Challenge my call first", "Luca"], ["decision journal", "Decided today, copies as a handover; reviews due behind a link", "Luca, you"], ["local or cloud", "badge behind More", "your ruling"]];
function overview() {
  return `<div style="display:flex;flex-direction:column;gap:34px">

        <span class="sub">${esc(p.quote)}</span><span class="eyebrow" style="color:var(--accent)">Open the prototype ›</span></button>`; }).join("")}</div></section>
    <section><h2>What makes today's Studio hard</h2><p class="muted">Read from the Studio components, the thread-file doc, the live API and screenshots of the running Desk. F7 to F9 come from the screenshots.</p>
      <div class="find">${FINDINGS.map(([c, h, t]) => `<span class="c">${c}</span><p><b>${esc(h)}</b> ${esc(t)}</p>`).join("")}</div></section>
    <section><h2>Same engine, fewer words</h2><p class="muted">One Studio writes the same thread files through the same acts.</p>
      <div class="tw"><table><thead><tr><th>Today</th><th>One Studio</th><th>Comes from</th></tr></thead><tbody>
      ${WORDS.map((r) => `<tr>${r.map((c, i) => `<td>${i === 0 ? `<span class="code">${esc(c)}</span>` : esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>

        <span class="c">2</span><p><b>The transcript is kept, behind one link.</b> It is laid out as turns with a name on each, and the Markdown is rendered.</p>
        <span class="c">3</span><p><b>Open points carry over.</b> The next session starts from the still-open list, not from a blank box.</p>

        <span class="c">D4</span><p><b>No cap; a Now view.</b> Kim's screen is the base.</p>

        <span class="c">D6</span><p><b>Nora's view is dropped.</b> Her Yes or Not quite reply and the reminder to check on a decision moved into One Studio.</p>

        <span class="c">Later</span><p><b>Plan it today as a real calendar entry.</b> Desk-only for now.</p>
      </div></section>

  const l = e.target.closest("[data-l]"); if (l) { lucaAct(l.dataset.l, l); render(); return; }

render();
</script>

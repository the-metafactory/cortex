# image — container image publish pipeline (cortex#2096, spec §L4b).
#
# Publishes the cortex container image to GHCR on every GitHub release. This is
# the L4b half of Linux host support (arc design/linux-host-support.md, arc#309):
# L4a (cortex#2095) ships deploy/compose/ with a LOCALLY-built image; this
# workflow makes `docker compose up -d` work with NO local checkout by publishing
# a pullable, tagged, attested image per release.
#
# ─── WHAT FIRES THIS ─────────────────────────────────────────────────────────
# `release: published` ONLY. Nothing publishes on push/PR/main — a pull only
# happens when a human (principal) cuts a GitHub release, at which point
# `github.event.release.tag_name` is the immutable ref we build from. We NEVER
# build from `main`: the image content is pinned to the release tag via the
# CORTEX_REF build-arg (the Dockerfile's default is a release tag, not main —
# see cortex#2095).
#
# ─── SUPPLY-CHAIN POSTURE (adversarial-review surface) ───────────────────────
#  • AUTH: GHCR login uses the built-in, per-run `GITHUB_TOKEN` — NOT a PAT and
#    NOT any org secret. The token is scoped to THIS repo by `permissions:` below.
#  • LEAST PRIVILEGE: top-level `permissions: contents: read`. The publish job
#    widens to exactly `packages: write` (push to GHCR) + `id-token: write` +
#    `attestations: write` (SLSA provenance signing via Sigstore OIDC). Nothing
#    else. No `secrets: inherit`; this workflow references no repo/org secrets.
#  • ACTION PINNING: every third-party action is pinned by 40-hex COMMIT SHA (tag
#    in the trailing comment for readability), NOT a movable tag. This is a
#    DELIBERATE hardening beyond ci.yml's `@v4`/`@v2` tag pins: a publish pipeline
#    holds registry-WRITE credentials, a strictly higher-privilege context than
#    the read-only CI jobs, and a compromised upstream tag could exfiltrate the
#    token or poison the image. This matches the SHA-pin precedent the repo
#    already sets for its security-sensitive reusable workflows
#    (.github/workflows/confidentiality-gate.yml). Refresh SHAs deliberately.
#  • PROVENANCE: SLSA build provenance is generated by actions/attest-build-provenance
#    and pushed to the registry as a referrer of the image digest. Verifiable with
#    `gh attestation verify oci://ghcr.io/the-metafactory/cortex:<tag> \
#      --repo the-metafactory/cortex`.
#
# ─── MERGE-TIME PRINCIPAL DECISIONS (leans implemented — pending confirmation) ─
# The following are implemented as the approved LEANS but are principal-confirmed
# at MERGE time (cortex#2096 un-hold comment). Change here if the principal rules
# differently at merge:
#   • registry/name = ghcr.io/the-metafactory/cortex
#   • image visibility = PUBLIC (a GHCR package-settings action, not a workflow
#     setting — see the note at the bottom of this file)
#   • provenance attestation = ON (this file)
#   • tags = the release tag ALWAYS; `:latest` moves ONLY on non-prereleases.
#     The committed compose default pins the release tag, never floating `:latest`
#     (cortex#2096 acceptance criterion).
name: image

on:
  release:
    types: [published]

# Least privilege at the top. The publish job widens to exactly what it needs.
permissions:
  contents: read

# One in-flight publish per release tag; never cancel a publish mid-push.
concurrency:
  group: image-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/the-metafactory/cortex

jobs:
  build-and-push:
    name: Build + push + attest (GHCR)
    runs-on: ubuntu-latest
    # Cap the run so a hung/wedged build can't hold a runner for the 6h default.
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      packages: write # push image + attestation to GHCR
      id-token: write # Sigstore OIDC — sign the SLSA provenance
      attestations: write # write the provenance attestation
    steps:
      - name: Checkout (release tag)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Build the exact commit the release points at, not the branch tip.
          ref: ${{ github.event.release.tag_name }}
          # Do NOT persist the job's GITHUB_TOKEN into .git/config. This job holds
          # the repo's most privileged token (packages:write + id-token:write +
          # attestations:write); `context: .` ships the repo root — incl. .git/ —
          # to the builder, so a persisted token could reach the image context.
          # Latent today (L4a's Dockerfile clones at CORTEX_REF, no broad `COPY .`)
          # but this removes the token from the context outright — defense in depth.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in per-run token, scoped by this job's `permissions`. Never a PAT.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags + OCI labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=cortex
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # Context is the repo root so the Dockerfile can COPY cortex source
          # (cortex#2095: Dockerfile.cortex lives under deploy/compose/ but builds
          # from the repo root, or installs CORTEX_REF).
          context: .
          file: deploy/compose/Dockerfile.cortex
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CORTEX_REF=${{ github.event.release.tag_name }}
          # Disable buildkit's inline (unsigned) provenance. We attach a SIGNED
          # SLSA attestation via actions/attest-build-provenance below; inline
          # provenance would also turn the single-arch push into a manifest list,
          # making steps.build.outputs.digest ambiguous for the attestation subject.
          provenance: false

      - name: Attest build provenance (SLSA, signed, pushed to registry)
        # Pinned by immutable SHA (the anchor). Trailing tag is v2.4.0, NOT the
        # latest major (v4.x exists) — the inputs used here (subject-name/-digest,
        # push-to-registry) are stable across majors; bump deliberately if desired.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # Push the attestation to GHCR as a referrer of the image digest, so a
          # puller can verify without GitHub API access.
          push-to-registry: true

# ─── ONE-TIME, OUT-OF-BAND OPS STEPS (not automatable in this workflow) ───────
#  1. First publish creates the GHCR package PRIVATE by default. Making it PUBLIC
#     (the merge-time lean) is a package-settings action a principal takes once in
#     the GHCR UI / `gh api` — it is NOT a field in this workflow. Until then,
#     `docker compose pull` on a fresh machine needs `docker login ghcr.io`.
#  2. The package's "Actions access" must permit this repo to push (GHCR links a
#     package to its source repo automatically on first push from Actions; verify).
